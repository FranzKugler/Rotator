name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.meta.outputs.channel }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Build ESP-IDF project
        uses: espressif/esp-idf-ci-action@e6f5c74232b1ccd4c97ed641f1e48553853f1fd5 # v1.2.0
        with:
          esp_idf_version: v5.4.1
          target: esp32s3
          path: .
          command: idf.py build

      - name: Work out version and channel
        id: meta
        run: |
          version="$(cat build/version.txt)"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            case "${{ github.ref_name }}" in
              v[0-9]*.[0-9]*.[0-9]*) ;;
              *) echo "Invalid release tag: ${{ github.ref_name }}" >&2; exit 1 ;;
            esac
            echo "channel=stable" >> "$GITHUB_OUTPUT"
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "channel=edge" >> "$GITHUB_OUTPUT"
            echo "tag=edge" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version $version"

      - name: Build web interface with the firmware version
        env:
          ROTATOR_VERSION: ${{ steps.meta.outputs.version }}
        run: npm ci && npm test && npm run build

      - name: Rebuild filesystem image
        uses: espressif/esp-idf-ci-action@e6f5c74232b1ccd4c97ed641f1e48553853f1fd5 # v1.2.0
        with:
          esp_idf_version: v5.4.1
          target: esp32s3
          path: .
          command: idf.py build

      - name: Write release manifest
        run: |
          notes="$(git log -1 --pretty=%s)"
          python3 scripts/manifest.py \
            --channel "${{ steps.meta.outputs.channel }}" \
            --version "${{ steps.meta.outputs.version }}" \
            --notes "$notes" \
            --base-url "https://github.com/${{ github.repository }}/releases/download/${{ steps.meta.outputs.tag }}" \
            --out manifest.json \
            build/Rotator.bin build/littlefs.bin

      - name: Publish edge release
        if: steps.meta.outputs.channel == 'edge'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'EOF'
          Rolling build of the latest commit on `main`, replaced on every push.
          This channel is untested; use the latest stable release for normal operation.

          | | |
          |---|---|
          | Version | `${{ steps.meta.outputs.version }}` |
          | Commit | ${{ github.sha }} |

          `Rotator.bin` is the firmware and `littlefs.bin` the browser interface.
          EOF
          gh release delete edge --yes --cleanup-tag || true
          gh release create edge \
            --prerelease \
            --title "Edge build ${{ steps.meta.outputs.version }}" \
            --notes-file notes.md \
            build/Rotator.bin build/littlefs.bin manifest.json

      # Only for stable: first-time flashing a blank chip wants the reviewed
      # release, and the flashing page always points at whichever stable
      # release last deployed it. This needs three parts a running rotator's
      # own OTA update never touches - the bootloader, the partition table
      # and the otadata stub that picks the factory partition to boot first -
      # alongside the firmware and filesystem image already built above.
      - name: Write the ESP Web Tools manifest
        if: steps.meta.outputs.channel == 'stable'
        run: |
          python3 scripts/web_tools_manifest.py \
            --version "${{ steps.meta.outputs.version }}" \
            --base-url . \
            --out esp-web-tools-manifest.json \
            build

      - name: Publish stable release
        if: steps.meta.outputs.channel == 'stable'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.meta.outputs.tag }}" \
            --title "${{ steps.meta.outputs.tag }}" \
            --generate-notes \
            build/Rotator.bin build/littlefs.bin manifest.json \
            build/bootloader/bootloader.bin build/partition_table/partition-table.bin \
            build/ota_data_initial.bin esp-web-tools-manifest.json

      # A browser fetch() of a GitHub release asset has no CORS header and is
      # silently blocked, so docs/index.html cannot point at /releases/ the
      # way a rotator's own OTA manifest does - the flashing page and its five
      # images have to be served from the same origin instead.
      - name: Stage the flashing page
        if: steps.meta.outputs.channel == 'stable'
        run: |
          mkdir -p pages/firmware
          cp -r docs/. pages/
          cp build/bootloader/bootloader.bin build/partition_table/partition-table.bin \
             build/ota_data_initial.bin build/Rotator.bin build/littlefs.bin \
             esp-web-tools-manifest.json \
             pages/firmware/

      - name: Configure Pages
        if: steps.meta.outputs.channel == 'stable'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload the flashing page
        if: steps.meta.outputs.channel == 'stable'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: pages

      - name: Summary
        run: |
          {
            echo "### ${{ steps.meta.outputs.channel }} ${{ steps.meta.outputs.version }}"
            echo
            echo '```json'
            cat manifest.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Separate job so it gets its own `github-pages` deployment environment and
  # its own, narrower token - the build job needs `contents: write` for the
  # releases, this one only ever needs to publish the artifact the build job
  # staged.
  deploy-pages:
    needs: build
    if: needs.build.outputs.channel == 'stable'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
